name: Prototipo Windows - tests y EXE

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validar sintaxis y módulos
        shell: pwsh
        run: python -m compileall -q desktop_prototype
      - name: Validar sintaxis PowerShell de build release
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD "desktop_prototype/Compilar-EXE.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Host
            throw "Compilar-EXE.ps1 contiene errores de sintaxis"
          }
      - name: Suite de pruebas
        shell: pwsh
        working-directory: desktop_prototype
        run: python -m unittest discover -s tests -v
      - name: Smoke UI panel de aplicaciones por EXE
        shell: pwsh
        working-directory: desktop_prototype
        run: |
          python -c 'import tkinter as tk; from control_panel import TrafficControlPanel; root = tk.Tk(); root.withdraw(); panel = TrafficControlPanel(root, lambda: None); root.update(); assert panel.win.winfo_exists(); panel.win.destroy(); root.destroy()'
          if ($LASTEXITCODE -ne 0) { throw "No se pudo abrir el panel de aplicaciones" }
      - name: Validar JavaScript y rutas de cuenta Premium
        shell: pwsh
        run: |
          node --check browser_companion/account_url.js
          if ($LASTEXITCODE -ne 0) { throw "Error de sintaxis en account_url.js" }
          node --check browser_companion/popup.js
          if ($LASTEXITCODE -ne 0) { throw "Error de sintaxis en popup.js" }
          node --test browser_companion/tests/account_url.test.js
          if ($LASTEXITCODE -ne 0) { throw "Fallaron las pruebas de URLs Premium" }
      - name: Compilar motor WFP propio (Windows SDK, sin drivers externos)
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "No hay instalador de Visual Studio / MSVC" }
          $vsVersion = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion
          if (-not $vsVersion) { throw "No se encontró MSVC C++ para Windows" }
          $major = [int]($vsVersion.Split(".")[0])
          $generator = switch ($major) {
            17 { "Visual Studio 17 2022" }
            18 { "Visual Studio 18 2026" }
            default { throw "Visual Studio no compatible: $vsVersion" }
          }
          Write-Host "Motor WFP: compilando con $generator"
          cmake -S native/wfp -B native/wfp/build -G $generator -A x64
          if ($LASTEXITCODE -ne 0) { throw "Error configurando WFP nativo con $generator" }
          cmake --build native/wfp/build --config Release
          if ($LASTEXITCODE -ne 0) { throw "Error compilando WFP nativo" }
          & native/wfp/build/Release/onetunnel-wfp-guard.exe --version
          if ($LASTEXITCODE -ne 0) { throw "Motor WFP no responde" }
          # Dry-run never installs filters, suitable for unprivileged CI.
          $sampleExe = Join-Path $env:WINDIR "System32/notepad.exe"
          & native/wfp/build/Release/onetunnel-wfp-guard.exe --dry-run $sampleExe
          if ($LASTEXITCODE -ne 0) { throw "Prevalidación de exe falló" }
          & native/wfp/build/Release/onetunnel-transparent-relay.exe --version
          if ($LASTEXITCODE -ne 0) { throw "Relay transparente no responde" }
          & native/wfp/build/Release/onetunnel-transparent-relay.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "Falló self-test del relay transparente" }
          & native/wfp/build/Release/onetunnel-wfp-control.exe --version
          if ($LASTEXITCODE -ne 0) { throw "Control plane WFP no responde" }
          & native/wfp/build/Release/onetunnel-wfp-control.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "Falló self-test del control plane WFP" }
          & native/wfp/build/Release/onetunnel-egress-probe.exe --version
          if ($LASTEXITCODE -ne 0) { throw "Probe de certificación no responde" }
          & native/wfp/build/Release/onetunnel-egress-probe.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "Falló self-test del probe NO_PROXY" }
      - name: Compilar callout WFP kernel (UNSIGNED, CI solamente)
        shell: pwsh
        run: |
          $nuget = (Get-Command nuget.exe -ErrorAction SilentlyContinue).Source
          if (-not $nuget) { throw "nuget.exe no está disponible en el runner" }
          & $nuget restore native/driver/packages.config -PackagesDirectory native/driver/packages -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw "No se pudo restaurar WDK NuGet" }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw "No se encontró Visual Studio/MSVC" }
          $msbuild = Join-Path $vsPath "MSBuild/Current/Bin/MSBuild.exe"
          & $msbuild native/driver/OneTunnelRedirect.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:SignMode=Off /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "No se pudo compilar el callout WFP" }

          $driver = "native/driver/bin/Release/onetunnel-wfp-redirect.sys"
          if (-not (Test-Path $driver)) { throw "No se generó el .sys del callout" }
          Write-Host "Callout WFP compilado sin instalar ni cargar: $driver"
      - name: Validar paquete primitive y generar catálogo SIN FIRMAR
        shell: pwsh
        run: |
          $wdk = Resolve-Path "native/driver/packages/Microsoft.Windows.WDK.x64.10.0.28000.2526"
          $infverif = Get-ChildItem $wdk -Filter InfVerif.exe -Recurse |
            Where-Object { $_.FullName -match '\\x64\\|\\x86\\' } |
            Select-Object -First 1
          $inf2cat = Get-ChildItem $wdk -Filter Inf2Cat.exe -Recurse |
            Where-Object { $_.FullName -match '\\x64\\|\\x86\\' } |
            Select-Object -First 1
          if (-not $infverif) { throw "WDK NuGet no contiene InfVerif.exe" }
          if (-not $inf2cat) { throw "WDK NuGet no contiene Inf2Cat.exe" }

          $package = Join-Path $PWD "native/driver/package"
          New-Item -ItemType Directory -Force $package | Out-Null
          Copy-Item "native/driver/OneTunnelRedirect.inf" $package
          Copy-Item "native/driver/bin/Release/onetunnel-wfp-redirect.sys" $package

          & $infverif.FullName /w (Join-Path $package "OneTunnelRedirect.inf")
          if ($LASTEXITCODE -ne 0) { throw "INF no cumple Windows Driver / aislamiento" }

          & $inf2cat.FullName /driver:$package /os:10_25H2_X64,10_GE_X64 /uselocaltime /verbose
          if ($LASTEXITCODE -ne 0) { throw "Inf2Cat rechazó el paquete" }

          $catalog = Join-Path $package "OneTunnelRedirect.cat"
          if (-not (Test-Path $catalog)) { throw "Inf2Cat no generó el catálogo" }
          Write-Host "Paquete SIGNABLE generado. El catálogo sigue SIN FIRMAR y NO debe instalarse."
      - name: Confirmar que Windows RECHAZA el paquete unsigned
        shell: pwsh
        run: python .github/scripts/assert_unsigned_driver_rejected.py native/driver/package
      - name: Guardar paquete WFP SIN FIRMAR (solo revisión)
        uses: actions/upload-artifact@v4
        with:
          name: OneTunnel-WFP-Package-UNSIGNED-CI
          path: native/driver/package/
          if-no-files-found: error
          retention-days: 7
      - name: Guardar callout WFP SIN FIRMAR (solo laboratorio)
        uses: actions/upload-artifact@v4
        with:
          name: OneTunnel-WFP-Callout-UNSIGNED-CI
          path: native/driver/bin/Release/onetunnel-wfp-redirect.sys
          if-no-files-found: error
          retention-days: 7
      - name: Crear EXE incluyendo componentes WFP propios
        shell: pwsh
        working-directory: desktop_prototype
        run: |
          python -m pip install pyinstaller==6.16.0
          python -m PyInstaller --noconfirm --clean --windowed --onefile --name 1VPN-Desktop-Lab --add-binary '..\\native\\wfp\\build\\Release\\onetunnel-wfp-guard.exe;.' --add-binary '..\\native\\wfp\\build\\Release\\onetunnel-transparent-relay.exe;.' --add-binary '..\\native\\wfp\\build\\Release\\onetunnel-wfp-control.exe;.' --add-binary '..\\native\\wfp\\build\\Release\\onetunnel-egress-probe.exe;.' app.py
          if ($LASTEXITCODE -ne 0) { throw "Error empaquetando componentes WFP" }
      - name: Guardar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: OneTunnel-v0.5.5-native-certification-alpha-win-x64
          path: desktop_prototype/dist/1VPN-Desktop-Lab.exe
          if-no-files-found: error
          retention-days: 14

      - name: Probar arranque del ejecutable empaquetado
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "desktop_prototype/dist/1VPN-Desktop-Lab.exe"
          $process = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 5
            $process.Refresh()
            if ($process.HasExited) {
              throw "El ejecutable terminó al arrancar (código $($process.ExitCode)); revisar Tcl/Tk"
            }
          } finally {
            $process.Refresh()
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }
      - name: Preparar extensión complementaria
        shell: pwsh
        run: Compress-Archive -Path browser_companion/* -DestinationPath browser_companion.zip -Force
      - name: Publicar extensión Premium complementaria
        uses: actions/upload-artifact@v4
        with:
          name: 1VPN-Premium-Browser-Companion
          path: browser_companion.zip
          if-no-files-found: error
          retention-days: 14
