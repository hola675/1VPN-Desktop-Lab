name: Prototipo Windows - tests y EXE

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validar sintaxis y módulos
        shell: pwsh
        run: python -m compileall -q desktop_prototype
      - name: Suite de pruebas
        shell: pwsh
        working-directory: desktop_prototype
        run: python -m unittest discover -s tests -v
      - name: Smoke UI panel de aplicaciones por EXE
        shell: pwsh
        working-directory: desktop_prototype
        run: |
          python -c 'import tkinter as tk; from control_panel import TrafficControlPanel; root = tk.Tk(); root.withdraw(); panel = TrafficControlPanel(root, lambda: None); root.update(); assert panel.win.winfo_exists(); panel.win.destroy(); root.destroy()'
          if ($LASTEXITCODE -ne 0) { throw "No se pudo abrir el panel de aplicaciones" }
      - name: Validar JavaScript y rutas de cuenta Premium
        shell: pwsh
        run: |
          node --check browser_companion/account_url.js
          if ($LASTEXITCODE -ne 0) { throw "Error de sintaxis en account_url.js" }
          node --check browser_companion/popup.js
          if ($LASTEXITCODE -ne 0) { throw "Error de sintaxis en popup.js" }
          node --test browser_companion/tests/account_url.test.js
          if ($LASTEXITCODE -ne 0) { throw "Fallaron las pruebas de URLs Premium" }
      - name: Crear exe sin driver
        shell: pwsh
        working-directory: desktop_prototype
        run: |
          python -m pip install pyinstaller==6.16.0
          python -m PyInstaller --noconfirm --clean --windowed --onefile --name 1VPN-Desktop-Lab app.py
      - name: Guardar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: 1VPN-Desktop-Lab-v0.4-dev-win-x64
          path: desktop_prototype/dist/1VPN-Desktop-Lab.exe
          if-no-files-found: error
          retention-days: 14

      - name: Probar arranque del ejecutable empaquetado
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "desktop_prototype/dist/1VPN-Desktop-Lab.exe"
          $process = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 5
            $process.Refresh()
            if ($process.HasExited) {
              throw "El ejecutable terminó al arrancar (código $($process.ExitCode)); revisar Tcl/Tk"
            }
          } finally {
            $process.Refresh()
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }
      - name: Preparar extensión complementaria
        shell: pwsh
        run: Compress-Archive -Path browser_companion/* -DestinationPath browser_companion.zip -Force
      - name: Publicar extensión Premium complementaria
        uses: actions/upload-artifact@v4
        with:
          name: 1VPN-Premium-Browser-Companion
          path: browser_companion.zip
          if-no-files-found: error
          retention-days: 14
